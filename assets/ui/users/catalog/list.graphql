query ($first: Int64!, $after: Cursor) {
	admin {
		users(first: $first, after: $after) {
			pageInfo {
				hasNextPage
				endCursor
			}
			nodes {
				id
				email
				name
				createdAt {
					formatted(layout: "2006-01-02 15:04")
				}
				lastSignInAt {
					formatted(layout: "2006-01-02 15:04")
				}
				isAdmin
				banReason
			}
		}
	}
}
