# Ported from the golden config for golangci-lint v2 by Marat Reymers (MIT),
# https://gist.github.com/maratori/47a4d00457a92aa426dbd48a18776322

version: "2"

issues:
  max-same-issues: 50

formatters:
  enable:
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - starterkit
    golines:
      max-len: 160
  exclusions:
    paths:
      - internal/db/db\.go
      - internal/db/models\.go
      - internal/db/queries\.read\.sql\.go
      - internal/db/queries\.write\.sql\.go
      - internal/graph/generated/
      - internal/graph/model/models_gen\.go
      - internal/graph/schema\.resolvers\.go
      - mocks_test\.go
      - assets/ui/.+/-/

linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - intrange
    - loggercheck
    - makezero
    - mirror
    - musttag
    - nakedret
    - nestif
    - nilerr
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    cyclop:
      max-complexity: 30
      package-average: 15.0

    depguard:
      rules:
        "deprecated":
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: use google.golang.org/protobuf instead
            - pkg: github.com/satori/go.uuid
              desc: use github.com/google/uuid instead, satori's package is not maintained
            - pkg: github.com/gofrs/uuid$
              desc: use github.com/gofrs/uuid/v5 or later, it was not a go module before v5
        "non-test files":
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: use math/rand/v2 instead
        "non-main files":
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: use log/slog instead

    errcheck:
      check-type-assertions: true

    exhaustive:
      check:
        - switch
        - map

    funlen:
      lines: 150
      statements: 75

    gochecksumtype:
      default-signifies-exhaustive: false

    gocognit:
      min-complexity: 30

    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true

    nakedret:
      max-func-lines: 0

    nolintlint:
      allow-no-explanation: [funlen, gocognit, golines]
      require-explanation: true
      require-specific: true

    perfsprint:
      strconcat: false

    reassign:
      patterns:
        - ".*"

    sloglint:
      no-global: all
      context: scope

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1016
        - -QF1008

  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: '_test\.go'
        linters:
          - bodyclose
          - dupl
          - errcheck
          - funlen
          - goconst
          - gosec
          - noctx
    paths:
      # adapted upstream code: dbmate's sqlite driver rebound to modernc.org/sqlite
      - internal/dbmate/sqlite/
      - internal/db/db\.go
      - internal/db/models\.go
      - internal/db/queries\.read\.sql\.go
      - internal/db/queries\.write\.sql\.go
      - internal/graph/generated/
      - internal/graph/model/models_gen\.go
      - internal/graph/schema\.resolvers\.go
      - mocks_test\.go
      - assets/ui/.+/-/
