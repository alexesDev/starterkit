version: "2"
sql:
  - engine: "sqlite"
    queries: "queries.read.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        initialisms: &initialisms ["id", "mcp"]
        overrides: &overrides
          - column: "*.created_at"
            go_type: &stamp
              import: "starterkit/internal/dbtime"
              type: "Stamp"
          - column: "*.last_signin_at"
            nullable: true
            go_type:
              import: "starterkit/internal/dbtime"
              type: "Stamp"
              pointer: true
          - column: "*.last_used_at"
            nullable: true
            go_type: &nullable_stamp
              import: "starterkit/internal/dbtime"
              type: "Stamp"
              pointer: true
          - column: "*.revoked_at"
            nullable: true
            go_type: *nullable_stamp
          - column: "mcp_keys.key_hash"
            go_type:
              import: "starterkit/internal/mcpkey"
              type: "Hash"

  - engine: "sqlite"
    queries: "queries.write.sql"
    schema: "db/schema.sql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        initialisms: *initialisms
        overrides: *overrides
